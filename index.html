<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flashcards</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131f24" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flashcards">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="home">
  <header class="stats">
    <span class="stat streak" title="Day streak">🔥 <b id="streak">0</b></span>
    <span class="stat xp" title="Total XP">⚡ <b id="xp">0</b></span>
    <span class="stat due" title="Cards due today">🎯 <b id="due">0</b></span>
  </header>
  <p id="summary"></p>
  <div id="topics"></div>
  <footer>
    <button id="export" class="link">Back up progress</button>
    <button id="import" class="link">Restore</button>
    <input id="importFile" type="file" accept="application/json" hidden>
  </footer>
</main>

<main id="study" hidden>
  <header class="bar">
    <button id="back" class="close" aria-label="Quit lesson">✕</button>
    <div class="progress" role="progressbar" aria-label="Lesson progress"><div id="progress"></div></div>
  </header>
  <h2 class="prompt">Select the correct answer</h2>
  <div class="ask">
    <span class="mascot small"></span>
    <p id="question" class="bubble"></p>
  </div>
  <div id="options"></div>
  <div class="dock"><button id="check" class="btn" disabled>Check</button></div>
</main>

<main id="done" hidden>
  <div class="done-body">
    <span class="mascot big cheer"></span>
    <h2 class="done-title">Lesson complete!</h2>
    <div class="tiles">
      <div class="tile gold"><small>Total XP</small><b id="tXp"></b></div>
      <div class="tile green"><small id="tAccLabel">Amazing</small><b id="tAcc"></b></div>
      <div class="tile blue"><small id="tTimeLabel">Speedy</small><b id="tTime"></b></div>
    </div>
  </div>
  <div class="dock stack">
    <button id="toRecap" class="btn outline">Lesson recap</button>
    <button id="claim" class="btn blue">Continue</button>
  </div>
</main>

<main id="recap" hidden>
  <header class="bar"><button id="recapBack" class="close" aria-label="Back">←</button></header>
  <h2 class="recap-title wrong-text">Review your mistakes this lesson</h2>
  <div id="mistakes"></div>
  <h2 class="recap-title right-text">You got these right</h2>
  <div id="rights"></div>
  <div class="dock"><button id="recapDone" class="btn blue">Continue</button></div>
</main>

<div id="sheet" hidden>
  <div class="sheet-inner">
    <h3 id="verdict"></h3>
    <p id="solution"></p>
    <p id="explain"></p>
    <button id="next" class="btn">Continue</button>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
